<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Navy blue backpack with a small elephant keychain on the zip">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#93c5fd" stop-opacity=".5"/><stop offset="1" stop-color="#93c5fd" stop-opacity="0"/></radialGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2748a8"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity=".3"/></filter>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <circle cx="300" cy="150" r="150" fill="url(#glow)"/>
  <ellipse cx="300" cy="266" rx="105" ry="9" fill="#0f172a" opacity=".14"/>
  <g filter="url(#sh)">
    <!-- top handle -->
    <path d="M268 62 Q268 36 300 36 Q332 36 332 62" fill="none" stroke="#0f1d4d" stroke-width="11" stroke-linecap="round"/>
    <!-- side pockets -->
    <rect x="198" y="168" width="30" height="70" rx="12" fill="#172554"/>
    <rect x="372" y="168" width="30" height="70" rx="12" fill="#172554"/>
    <!-- main body -->
    <path d="M222 112 Q222 56 300 56 Q378 56 378 112 V228 Q378 258 348 258 H252 Q222 258 222 228 Z" fill="url(#navy)"/>
    <!-- main zip -->
    <path d="M232 112 Q300 90 368 112" fill="none" stroke="#94a3b8" stroke-width="3.2" stroke-dasharray="3 2.2" stroke-linecap="round"/>
    <path d="M232 112 Q300 90 368 112" fill="none" stroke="#0f172a" stroke-width="1" opacity=".5"/>
    <!-- front pocket -->
    <path d="M236 168 Q236 156 248 156 H352 Q364 156 364 168 V232 Q364 246 350 246 H250 Q236 246 236 232 Z" fill="url(#pocket)"/>
    <path d="M240 168 H360" stroke="#94a3b8" stroke-width="3" stroke-dasharray="3 2.2" stroke-linecap="round"/>
    <rect x="262" y="206" width="44" height="22" rx="6" fill="none" stroke="#60a5fa" stroke-width="1.6" opacity=".7"/>
    <path d="M272 217 H296" stroke="#93c5fd" stroke-width="2.4" stroke-linecap="round" opacity=".8"/>
    <!-- compression strap -->
    <rect x="222" y="134" width="156" height="8" fill="#0f1d4d" opacity=".55"/>
    <!-- zip pulls -->
    <rect x="352" y="104" width="6" height="15" rx="3" fill="#cbd5e1" transform="rotate(-14 355 111)"/>
    <rect x="339" y="160" width="6" height="12" rx="3" fill="#cbd5e1"/>
    <!-- elephant keychain on main zip -->
    <path d="M357 118 Q364 128 372 136" fill="none" stroke="#cbd5e1" stroke-width="1.6"/>
    <g transform="translate(372 150)">
      <ellipse cx="2" cy="4" rx="12" ry="9" fill="#94a3b8"/>
      <rect x="-5" y="9" width="4.5" height="9" rx="2" fill="#7c8aa0"/><rect x="5" y="9" width="4.5" height="9" rx="2" fill="#7c8aa0"/>
      <circle cx="-8" cy="0" r="7.5" fill="#a3b0c2"/>
      <path d="M-13 3 Q-19 8 -17 15 Q-16 17 -14 15 Q-14 9 -10 6" fill="#a3b0c2"/>
      <ellipse cx="-1" cy="-1" rx="5" ry="6" fill="#7c8aa0"/>
      <circle cx="-10" cy="-1.5" r="1.1" fill="#0f172a"/>
    </g>
  </g>
  <!-- fabric sheen -->
  <path d="M240 70 Q300 52 330 66 Q270 80 238 130 Z" fill="#fff" opacity=".07"/>
</svg>
