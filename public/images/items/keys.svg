<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Three keys on a red keychain with a small bell">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fca5a5" stop-opacity=".45"/><stop offset="1" stop-color="#fca5a5" stop-opacity="0"/></radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="0.5" stop-color="#cbd5e1"/><stop offset="1" stop-color="#94a3b8"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#b91c1c"/></linearGradient>
    <filter id="sh" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity=".28"/></filter>
    <g id="key">
      <rect x="12" y="-5.5" width="86" height="11" rx="3"/>
      <path d="M62 4 H72 V17 H62 Z M78 4 H86 V12 H78 Z M90 4 H98 V14 H90 Z"/>
      <circle r="18"/>
    </g>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <circle cx="300" cy="150" r="150" fill="url(#glow)"/>
  <ellipse cx="305" cy="268" rx="120" ry="9" fill="#0f172a" opacity=".12"/>
  <g filter="url(#sh)">
    <!-- keys fanned below the ring -->
    <g transform="translate(274 120) rotate(118)"><use href="#key" fill="url(#silver)" stroke="#94a3b8" stroke-width="1"/><circle r="6" fill="#e2e8f0" stroke="#94a3b8"/></g>
    <g transform="translate(292 126) rotate(92)"><use href="#key" fill="url(#gold)" stroke="#b45309" stroke-width="1"/><circle r="6" fill="#fef3c7" stroke="#b45309"/></g>
    <g transform="translate(310 120) rotate(66)"><use href="#key" fill="url(#silver)" stroke="#94a3b8" stroke-width="1"/><circle r="6" fill="#e2e8f0" stroke="#94a3b8"/></g>
    <!-- split ring -->
    <circle cx="292" cy="96" r="30" fill="none" stroke="#64748b" stroke-width="6"/>
    <circle cx="292" cy="96" r="30" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="60 130" transform="rotate(-70 292 96)"/>
    <!-- red leather fob -->
    <path d="M318 84 Q338 88 346 112" fill="none" stroke="#7f1d1d" stroke-width="7" stroke-linecap="round"/>
    <g transform="rotate(14 372 160)">
      <rect x="340" y="108" width="64" height="98" rx="16" fill="url(#red)"/>
      <rect x="347" y="115" width="50" height="84" rx="10" fill="none" stroke="#fecaca" stroke-width="1.4" stroke-dasharray="5 4" opacity=".8"/>
      <circle cx="372" cy="124" r="5" fill="#fee2e2"/>
      <path d="M358 160 H386 M358 172 H378" stroke="#fecaca" stroke-width="3" stroke-linecap="round" opacity=".75"/>
    </g>
    <!-- bell -->
    <path d="M385 207 Q392 213 396 224" fill="none" stroke="#64748b" stroke-width="2.5"/>
    <g transform="translate(398 240)">
      <circle r="15" fill="url(#gold)" stroke="#b45309" stroke-width="1"/>
      <path d="M-15 3 H15" stroke="#92400e" stroke-width="2.2"/>
      <circle cy="9" r="2.6" fill="#92400e"/>
      <ellipse cx="-6" cy="-6" rx="3.2" ry="5.5" fill="#fff" opacity=".4" transform="rotate(25 -6 -6)"/>
    </g>
  </g>
</svg>
