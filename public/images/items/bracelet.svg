<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Thin silver bracelet with a heart charm engraved with the letter M">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#c4b5fd" stop-opacity=".5"/><stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/></radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="0.45" stop-color="#94a3b8"/><stop offset="0.7" stop-color="#e2e8f0"/><stop offset="1" stop-color="#64748b"/></linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="0.55" stop-color="#cbd5e1"/><stop offset="1" stop-color="#94a3b8"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity=".3"/></filter>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <circle cx="300" cy="150" r="150" fill="url(#glow)"/>
  <ellipse cx="300" cy="270" rx="110" ry="8" fill="#0f172a" opacity=".12"/>
  <g filter="url(#sh)">
    <!-- bracelet band (chain links look) -->
    <ellipse cx="300" cy="120" rx="112" ry="76" fill="none" stroke="url(#silver)" stroke-width="9"/>
    <ellipse cx="300" cy="120" rx="112" ry="76" fill="none" stroke="#475569" stroke-width="9" stroke-dasharray="1.5 11" opacity=".55"/>
    <ellipse cx="300" cy="120" rx="112" ry="76" fill="none" stroke="#fff" stroke-width="2" opacity=".75" stroke-linecap="round" stroke-dasharray="70 700" stroke-dashoffset="-345"/>
    <!-- clasp -->
    <g transform="translate(188 120)">
      <circle r="8" fill="url(#heart)" stroke="#64748b" stroke-width="1.5"/><circle r="3" fill="#e2e8f0" stroke="#64748b"/>
    </g>
    <!-- connector ring -->
    <circle cx="300" cy="198" r="6.5" fill="none" stroke="#64748b" stroke-width="3"/>
    <!-- heart charm -->
    <g transform="translate(300 226) scale(1.75)">
      <path d="M0 15 C-26 -4 -16 -24 0 -10 C16 -24 26 -4 0 15 Z" fill="url(#heart)" stroke="#64748b" stroke-width="1.1" stroke-linejoin="round"/>
      <path d="M-11 -9 Q-17 -6 -14 2" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>
      <text x="0" y="5.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" fill="#64748b">M</text>
    </g>
  </g>
</svg>
