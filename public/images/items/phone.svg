<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Black phone in a blue case with a cracked screen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#93c5fd" stop-opacity=".55"/><stop offset="1" stop-color="#93c5fd" stop-opacity="0"/></radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <filter id="sh" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity=".28"/></filter>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <circle cx="300" cy="150" r="140" fill="url(#glow)"/>
  <ellipse cx="300" cy="268" rx="70" ry="9" fill="#0f172a" opacity=".14"/>
  <g filter="url(#sh)">
    <!-- side buttons -->
    <rect x="354" y="104" width="4" height="30" rx="2" fill="#1e40af"/>
    <rect x="354" y="146" width="4" height="18" rx="2" fill="#1e40af"/>
    <!-- case + body -->
    <rect x="243" y="40" width="112" height="224" rx="22" fill="url(#case)"/>
    <rect x="250" y="47" width="98" height="210" rx="16" fill="#0b0f19"/>
    <rect x="254" y="51" width="90" height="202" rx="12" fill="url(#screen)"/>
  </g>
  <!-- camera dot + speaker -->
  <circle cx="299" cy="62" r="3.2" fill="#020617"/>
  <rect x="283" y="57" width="12" height="2.4" rx="1.2" fill="#020617" opacity=".7"/>
  <!-- lock screen -->
  <text x="299" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="300" fill="#f8fafc">10:24</text>
  <text x="299" y="123" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#94a3b8">Wed, 28 Oct</text>
  <!-- dog wallpaper -->
  <g transform="translate(299 183)">
    <circle r="36" fill="#fde68a" opacity=".18"/>
    <ellipse cx="-22" cy="-6" rx="9" ry="17" fill="#7c4a1e" transform="rotate(18 -22 -6)"/>
    <ellipse cx="22" cy="-6" rx="9" ry="17" fill="#7c4a1e" transform="rotate(-18 22 -6)"/>
    <ellipse cx="0" cy="2" rx="21" ry="22" fill="#d9a05b"/>
    <ellipse cx="0" cy="11" rx="11" ry="9" fill="#f3d7aa"/>
    <circle cx="-8" cy="-3" r="2.6" fill="#1f2937"/><circle cx="8" cy="-3" r="2.6" fill="#1f2937"/>
    <ellipse cx="0" cy="7" rx="4" ry="3" fill="#1f2937"/>
    <path d="M0 10 V14 M0 14 Q-4 18 -7 15 M0 14 Q4 18 7 15" stroke="#1f2937" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- bottom swipe bar -->
  <rect x="283" y="241" width="32" height="3" rx="1.5" fill="#e2e8f0" opacity=".75"/>
  <!-- cracked screen -->
  <g stroke="#e2e8f0" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M344 51 L326 92 L333 118 L312 150 L318 176 L300 214" stroke-width="1.3" opacity=".9"/>
    <path d="M326 92 L303 101 L292 96" stroke-width="1" opacity=".75"/>
    <path d="M333 118 L344 131" stroke-width="1" opacity=".75"/>
    <path d="M312 150 L292 156 L281 150" stroke-width=".9" opacity=".6"/>
    <path d="M318 176 L336 190" stroke-width=".9" opacity=".6"/>
    <path d="M344 51 L330 56 M344 51 L344 70" stroke-width="1" opacity=".7"/>
  </g>
  <!-- glass sheen -->
  <path d="M254 51 H300 L254 150 Z" fill="#fff" opacity=".05"/>
</svg>
